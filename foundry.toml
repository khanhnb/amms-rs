[profile.default]
src = "contracts"
out = "contracts/out"
libs = ["contracts/lib"]
optimizer = false
evm_version = "paris"
remappings = ["forge-std=contracts/lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "./" }]

[lint]
ignore = ["contracts/lib/**/*"]

[fmt]
line_length = 80
tab_width = 4

